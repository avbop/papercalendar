[project]
name = "papercalendar"
version = "0.9.0"
description = "Generate a printable weekly calendar with liturgical information."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
calendar = "generate:main"

[tool.uv]
package = true

[tool.pytest]
addopts = ["--doctest-modules"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
